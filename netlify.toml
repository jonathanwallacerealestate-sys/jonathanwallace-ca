# redeploy 2604
# Netlify configuration — jonathanwallace.ca
# Static site: no build step, publish the repo root.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Pretty URLs / basic hardening headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Private home-value lab. Keep /lab/* out of search even if a URL is shared.
[[headers]]
  for = "/lab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Cache the latest-videos API at the edge (refresh hourly, serve stale meanwhile)
[[headers]]
  for = "/.netlify/functions/latest-videos"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

# Cache the Google reviews API at the edge (refresh daily, serve stale meanwhile)
[[headers]]
  for = "/.netlify/functions/google-reviews"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800"

# Keep llms.txt readable as plain text at both the root and well-known paths
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/.well-known/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

