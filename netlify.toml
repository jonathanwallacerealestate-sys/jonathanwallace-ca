# ---------------------------------------------------------------------------
# Canonical consolidations (2026-09-16 audit)
# Policy: <link rel=canonical> is the target of truth.
#   - If canonical is *.html, 301 the extensionless pretty URL → .html
#   - If canonical is extensionless, 301 the .html variant → bare
#   - force=true overrides Netlify pretty-URL 200s so both variants do not stay live
#   - Existing 200 rewrites (branded community / sell-your-home / find-your-home /
#     whats-it-take) are left alone; we 301 only the non-canonical file path
#   - /home-valuation and /home-valuation.html 301 to /home-value.html (canonical)
#   - /index.html 301 to / (homepage canonical)
#   - No redirect loops: source != target, and 200 rewrite sources are never 301'd
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

